// W3N1 网络包的 payload 层（自有 25B 帧头保持不变，见 packet.rs / ADR 0005）。
//
// canonical 约束（ADR 0005 §3 / protobuf-payload spec）：
// - 禁止 map 字段（集合一律 repeated + 显式顺序）。
// - 字段编号只追加、不复用、不改名；删除字段保留 reserved。
// - 禁止 float / double；定点数值用 int64 承载 SimFixed::raw()。
// - 禁止 unknown fields 透传 / 回显：prost 解码默认丢弃未知字段，不存储、不回显。
// - schema 变更必须同步 bump packet.rs 的 PROTOCOL_VERSION。
// - 每个消息显式 reserved 若干编号，提示后续只追加。
//
// PROTOCOL_VERSION 3：新增玩法命令线格式（ADR 0005 §3）。玩法命令用独立的
// GameplayCommand 消息与 GameplayCommandBatch，只在顶层 CommandBatch 追加；
// 既有 Command 的 oneof 与控制包字段编号、reserved 一律零改动。
// PROTOCOL_VERSION 4（新增游戏玩法命令变体 ReviveHero / CancelRevive）：
// 在 GameplayCommand.oneof 只追加 tag 33 / 34，reserved 14 to 32 原样保留；
// 明确拒绝 v3，玩法命令字段不被静默当作 unknown field（ADR 0005 §3）。
// PROTOCOL_VERSION 5（新增游戏玩法命令变体 UpgradeTownHall）：
// 在 GameplayCommand.oneof 只追加 tag 35，reserved 14 to 32 原样保留；
// 新增 GameplayUpgradeTownHall 消息，字段编号只追加、尾部保留 reserved；
// 明确拒绝 v4，玩法命令字段不被静默当作 unknown field（ADR 0005 §3）。
// PROTOCOL_VERSION 6（新增系统级游戏玩法命令变体 SeedCreepCamp）：
// 在 GameplayCommand.oneof 只追加 tag 36，reserved 14 to 32 原样保留；
// 新增 GameplaySeedCreepCamp 消息，camp / script 用 uint32 定宽承载；
// 明确拒绝 v5，玩法命令字段不被静默当作 unknown field（ADR 0005 §3）。
// player_id 的 NEUTRAL_OWNER 同源校验由 w3-core 承担，protobuf 层不校验。
// PROTOCOL_VERSION 7（P8.5d 新增 9 个物品 / 商店 / 回城玩法命令变体）：
// 在 GameplayCommand.oneof 只追加 tag 37–45，reserved 14 to 32 与
// tag 33/34/35/36 一字不动；每个新 message 字段编号只追加、尾部保留 reserved；
// 明确拒绝 v6，玩法命令字段不被静默当作 unknown field（ADR 0005 §3）。
// PROTOCOL_VERSION 8（P9 新增 13 个族特色机制玩法命令变体）：
// 在 GameplayCommand.oneof 只追加 tag 46–58，reserved 14 to 32 与
// tag 33/34/35/36/37–45 一字不动；每个新 message 字段编号只追加、
// 尾部保留 reserved；EntityId 用 uint64 的 value()、网格坐标 / 恢复量
// 用 int64 定宽承载并在解码时显式校验 i32 / i64 值域，回血条件用
// RegenCondition::code() 的 uint32 稳定码；明确拒绝 v7，玩法命令字段
// 不被静默当作 unknown field（ADR 0005 §3）。
// PROTOCOL_VERSION 9（P11 技能系统新增 5 个施法 / 英雄技能玩法命令变体）：
// 在 GameplayCommand.oneof 只追加 tag 59–63，reserved 14 to 32 与
// tag 4–13 / 33–58 一字不动；每个新 message 字段编号只追加、尾部保留 reserved；
// EntityId 用 uint64 的 value()、DefId 用 uint32 定宽，点 / 范围 / 方向坐标、
// 半径与方向向量一律用 int64 承载 Q47.16 整数原始值；EffectDef 沿用
// uint32 effect_kind 承载 0–12 稳定效果码、字段编号与 reserved 4 to 8 保持不动；
// 明确拒绝 v8，玩法命令字段不被静默当作 unknown field（ADR 0005 §3）。
// PROTOCOL_VERSION 10（P18 新增酒馆买活玩法命令变体 BuybackHero）：
// 在 GameplayCommand.oneof 只追加 tag 64，reserved 14 to 32 与
// tag 4–13 / 33–63 一字不动；新增 GameplayBuybackHero 消息，两个字段
// 均为 EntityId，一律用 uint64 的 value()、字段编号只追加、尾部保留 reserved；
// 明确拒绝 v9，玩法命令字段不被静默当作 unknown field（ADR 0005 §3）。

syntax = "proto3";
package w3net;

// 一批输入命令（Input / Frame / ResyncReplay 内的命令集）。
// tag 9 的玩法命令批只追加在 reserved 2 to 8 之后；玩法命令为空时该字段不编码。
message CommandBatch {
  repeated Command commands = 1;
  reserved 2 to 8;
  GameplayCommandBatch gameplay = 9;
}

message Command {
  uint64 execute_frame = 1;
  uint32 player_id = 2;
  uint32 sequence = 3;
  oneof kind {
    Noop noop = 4;
    Spawn spawn = 5;
    MoveCommand move_cmd = 6;
    Stop stop = 7;
    Attack attack = 8;
    SetObstacle set_obstacle = 9;
    RemoveObstacle remove_obstacle = 10;
  }
  reserved 11 to 16;
}

message Noop {}
message Spawn {
  int64 x = 1;
  int64 y = 2;
  int64 hp = 3;
  int64 speed = 4;
  int64 attack_damage = 5;
  int64 attack_range = 6;
  reserved 7 to 10;
}
message MoveCommand {
  uint64 entity = 1;
  int64 x = 2;
  int64 y = 3;
  uint32 group = 4;
  bool append = 5;
  reserved 6 to 10;
}
message Stop {
  uint64 entity = 1;
  reserved 2 to 6;
}
message Attack {
  uint64 attacker = 1;
  uint64 target = 2;
  reserved 3 to 6;
}
message SetObstacle {
  uint64 id = 1;
  int32 x = 2;
  int32 y = 3;
  int32 w = 4;
  int32 h = 5;
  reserved 6 to 10;
}
message RemoveObstacle {
  uint64 id = 1;
  reserved 2 to 6;
}

// 控制包 payload。
message Welcome {
  uint32 player_id = 1;
  uint64 current_frame = 2;
  reserved 3 to 6;
}
message Ack {
  uint32 sequence = 1;
  reserved 2 to 6;
}
message Checksum {
  uint64 hash = 1;
  reserved 2 to 6;
}
message ResyncRequest {
  uint32 player_id = 1;
  uint64 from_frame = 2;
  reserved 3 to 6;
}
message FrameCommands {
  uint64 frame = 1;
  CommandBatch commands = 2;
  reserved 3 to 6;
}
message ResyncReplay {
  repeated FrameCommands frames = 1;
  reserved 2 to 6;
}
message Reject {
  string reason = 1;
  reserved 2 to 6;
}

// ---- 玩法命令线格式（PROTOCOL_VERSION 3 引入 / 4 追加两个变体 / 5 追加一个变体 / 6 追加一个变体 / 7 追加九个变体 / 8 追加十三个变体，只追加，见 ADR 0005 §3）----

// 效果定义（玩法命令参数）：EffectKind 用稳定码 uint32 承载，amount 用 int64。
message EffectDef {
  uint32 effect_kind = 1;
  int64 amount = 2;
  uint32 duration_frames = 3;
  reserved 4 to 8;
}

// 玩法命令：execute_frame / player_id / sequence 与 w3_core::GameplayCommand 一一对应。
// oneof kind 用 tag 4–13 覆盖前 10 个玩法变体；PROTOCOL_VERSION 4 在
// reserved 14 to 32 之后只追加 tag 33 / 34 两个变体，PROTOCOL_VERSION 5
// 再只追加 tag 35 一个变体，PROTOCOL_VERSION 6 再只追加 tag 36 一个变体，
// PROTOCOL_VERSION 7 再只追加 tag 37–45 九个变体，PROTOCOL_VERSION 8
// 再只追加 tag 46–58 十三个族特色机制变体
// （均跳过 reserved 段，字段编号只追加、不复用、不改名）。
// arrival 不编码，由各端提交时按稳定序本地分配。
message GameplayCommand {
  uint64 execute_frame = 1;
  uint32 player_id = 2;
  uint32 sequence = 3;
  oneof kind {
    GameplayCast cast = 4;
    GameplayTrain train = 5;
    GameplayCancelTrain cancel_train = 6;
    GameplayResearch research = 7;
    GameplayBuyItem buy_item = 8;
    GameplayGather gather = 9;
    GameplayRegisterBehavior register_behavior = 10;
    GameplaySpawnWave spawn_wave = 11;
    GameplaySetAi set_ai = 12;
    GameplayLeave leave = 13;
    GameplayReviveHero revive_hero = 33;
    GameplayCancelRevive cancel_revive = 34;
    GameplayUpgradeTownHall upgrade_town_hall = 35;
    GameplaySeedCreepCamp seed_creep_camp = 36;
    GameplayPickupGroundItem pickup_ground_item = 37;
    GameplayBuyFromShop buy_from_shop = 38;
    GameplayUseItem use_item = 39;
    GameplayDropItem drop_item = 40;
    GameplayTransferItem transfer_item = 41;
    GameplaySellItem sell_item = 42;
    GameplayUseTownPortal use_town_portal = 43;
    GameplayCancelTownPortal cancel_town_portal = 44;
    GameplayRefreshMarket refresh_market = 45;
    GameplaySeedBlight seed_blight = 46;
    GameplayRaiseCorpse raise_corpse = 47;
    GameplayConsumeCorpse consume_corpse = 48;
    GameplayHauntGoldMine haunt_gold_mine = 49;
    GameplayEntangleGoldMine entangle_gold_mine = 50;
    GameplaySetAncientRoot set_ancient_root = 51;
    GameplayBindMoonWell bind_moon_well = 52;
    GameplaySetStealth set_stealth = 53;
    GameplayRegisterDetector register_detector = 54;
    GameplaySetNightCloak set_night_cloak = 55;
    GameplayMarkSightBlocker mark_sight_blocker = 56;
    GameplaySetCreepSleep set_creep_sleep = 57;
    GameplaySetRegenCondition set_regen_condition = 58;
    GameplayCastPoint cast_point = 59;
    GameplayCastArea cast_area = 60;
    GameplayCastDirection cast_direction = 61;
    GameplayLearnAbility learn_ability = 62;
    GameplayLevelUpHero level_up_hero = 63;
    GameplayBuybackHero buyback_hero = 64;
  }
  reserved 14 to 32;
}

// 施法：EntityId 用 uint64 的 value()，DefId 用 uint32。
message GameplayCast {
  uint64 caster = 1;
  uint32 ability = 2;
  uint64 target = 3;
  reserved 4 to 8;
}
// 生产 / 建造。
message GameplayTrain {
  uint64 producer = 1;
  uint32 unit_def = 2;
  bool is_building = 3;
  reserved 4 to 8;
}
// 取消生产。
message GameplayCancelTrain {
  uint64 producer = 1;
  uint32 index = 2;
  reserved 3 to 8;
}
// 研究。
message GameplayResearch {
  uint32 upgrade = 1;
  reserved 2 to 8;
}
// 购买物品。
message GameplayBuyItem {
  uint64 unit = 1;
  uint32 item = 2;
  reserved 3 to 8;
}
// 采集。
message GameplayGather {
  uint64 unit = 1;
  reserved 2 to 8;
}
// 注册行为：EffectDef 作为独立消息承载（稳定码 / int64 / uint32）。
message GameplayRegisterBehavior {
  uint32 id = 1;
  EffectDef effect = 2;
  reserved 3 to 8;
}
// 波次。
message GameplaySpawnWave {
  uint32 id = 1;
  uint32 period = 2;
  reserved 3 to 8;
}
// AI 设置。
message GameplaySetAi {
  bool enabled = 1;
  reserved 2 to 8;
}
// 离开：w3_core 的 u8 用 uint32 承载，解码时显式校验不溢出。
message GameplayLeave {
  uint32 player = 1;
  reserved 2 to 8;
}
// 祭坛复活（PROTOCOL_VERSION 4 追加）：EntityId 用 uint64 的 value()，
// DefId 用 u32，解码时无符号不溢出；字段编号只追加，尾部保留 reserved。
message GameplayReviveHero {
  uint64 hero = 1;
  uint64 altar = 2;
  uint32 altar_def = 3;
  reserved 4 to 8;
}
// 取消复活（PROTOCOL_VERSION 4 追加）：目标英雄 EntityId 用 uint64。
message GameplayCancelRevive {
  uint64 hero = 1;
  reserved 2 to 8;
}
// 主城升级 / 取消升级（PROTOCOL_VERSION 5 追加）：EntityId 用 uint64 的 value()，
// DefId 用 uint32，target_tier 用 TownHallTier::code() 的稳定 uint32 码，
// cancel 为变体内字段（false 发起 / true 取消），不另设第二个命令变体。
// 字段编号只追加，尾部保留 reserved。
message GameplayUpgradeTownHall {
  uint64 town_hall = 1;
  uint32 town_hall_def = 2;
  uint32 target_tier = 3;
  bool cancel = 4;
  reserved 5 to 8;
}
// 野怪营地装配（PROTOCOL_VERSION 6 追加）：系统级 frame-0 确定性命令，
// camp 为营地实例 id、script 为冻结营地脚本 id，均为 uint32 定宽、无收窄
// 溢出分支；player_id 的 NEUTRAL_OWNER 同源校验在 w3-core 侧，线格式层
// 只忠实传输，不猜测、不回退。字段编号只追加，尾部保留 reserved。
message GameplaySeedCreepCamp {
  uint32 camp = 1;
  uint32 script = 2;
  reserved 3 to 8;
}

// 以下九个消息为 PROTOCOL_VERSION 7（P8.5d 物品 / 商店 / 回城）追加：
// EntityId 一律 uint64 的 value()，shop / shelf / batch 一律 uint32 定宽；
// 玩家归属 / 系统级 NEUTRAL_OWNER 同源校验由 w3-core 承担，线格式层
// 只忠实传输、不猜测、不回退。字段编号只追加，尾部保留 reserved。
// 拾取地面物品（kind 码 15）：英雄与地面物品实例均为 EntityId。
message GameplayPickupGroundItem {
  uint64 hero = 1;
  uint64 ground_item = 2;
  reserved 3 to 8;
}
// 商店购买（kind 码 16）：shop 为商店 id，shelf 为货架 id。
message GameplayBuyFromShop {
  uint64 hero = 1;
  uint32 shop = 2;
  uint32 shelf = 3;
  reserved 4 to 8;
}
// 使用道具（kind 码 17）：target 为 EntityId::NONE 时表示自身。
message GameplayUseItem {
  uint64 hero = 1;
  uint64 instance = 2;
  uint64 target = 3;
  reserved 4 to 8;
}
// 丢弃道具（kind 码 18）：实例以同一 EntityId 回地面。
message GameplayDropItem {
  uint64 hero = 1;
  uint64 instance = 2;
  reserved 3 to 8;
}
// 移交道具（kind 码 19）：两英雄六格背包间迁移同一实例。
message GameplayTransferItem {
  uint64 from_hero = 1;
  uint64 to_hero = 2;
  uint64 instance = 3;
  reserved 4 to 8;
}
// 售卖道具（kind 码 20）：shop 为回收商店 id。
message GameplaySellItem {
  uint64 hero = 1;
  uint64 instance = 2;
  uint32 shop = 3;
  reserved 4 to 8;
}
// 使用回城卷轴（kind 码 21）：目标按友方主城分类由内核数据驱动选出。
message GameplayUseTownPortal {
  uint64 hero = 1;
  uint64 instance = 2;
  reserved 3 to 8;
}
// 中断回城施法（kind 码 22）：仅携带目标英雄 EntityId。
message GameplayCancelTownPortal {
  uint64 hero = 1;
  reserved 2 to 8;
}
// 系统级市场刷新（kind 码 23）：shop / batch 均为 uint32 定宽，
// player_id 的 NEUTRAL_OWNER 同源校验在 w3-core 侧，线格式层不校验。
message GameplayRefreshMarket {
  uint32 shop = 1;
  uint32 batch = 2;
  reserved 3 to 8;
}

// 以下十三个消息为 PROTOCOL_VERSION 8（P9 族特色机制）只追加：
// EntityId 一律 uint64 的 value()；网格坐标 / 月亮井恢复量用 int64
// 定宽承载（解码时显式校验 i32 / i64 值域，溢出明确拒绝），衰减帧数用
// uint32，布尔开关用 bool，回血条件用 RegenCondition::code() 的 uint32
// 稳定码（非法码明确拒绝）；玩家归属 / 语义合法性由 w3-core 同源校验
// 承担，线格式层只忠实传输、不猜测、不回退。字段编号只追加、尾部
// 保留 reserved，禁 map / 禁 float / 禁 double 全部继续适用。
// 腐地扩张源与初始格（kind 码 24）：cell_x / cell_y 为 i32 网格坐标。
message GameplaySeedBlight {
  uint64 source = 1;
  int64 cell_x = 2;
  int64 cell_y = 3;
  reserved 4 to 8;
}
// 尸体登记（kind 码 25）：decay_frames 为剩余衰减整数帧。
message GameplayRaiseCorpse {
  uint64 corpse = 1;
  uint32 decay_frames = 2;
  reserved 3 to 8;
}
// 食尸回血 / 召唤骷髅（kind 码 26）：消费者与目标尸体均为 EntityId。
message GameplayConsumeCorpse {
  uint64 consumer = 1;
  uint64 corpse = 2;
  reserved 3 to 8;
}
// 诅咒金矿（kind 码 27）：登记金矿实体。
message GameplayHauntGoldMine {
  uint64 mine = 1;
  reserved 2 to 8;
}
// 缠绕金矿（kind 码 28）：登记金矿实体。
message GameplayEntangleGoldMine {
  uint64 mine = 1;
  reserved 2 to 8;
}
// 古树扎根 / 拔根（kind 码 29）：rooted 为变体内布尔字段。
message GameplaySetAncientRoot {
  uint64 ancient = 1;
  bool rooted = 2;
  reserved 3 to 8;
}
// 月亮井恢复登记（kind 码 30）：restore 为 int64 单次恢复量。
message GameplayBindMoonWell {
  uint64 well = 1;
  int64 restore = 2;
  reserved 3 to 8;
}
// 隐身目标判定（kind 码 31）：玩法机制输入，非 fog 可见性。
message GameplaySetStealth {
  uint64 unit = 1;
  bool cloaked = 2;
  reserved 3 to 8;
}
// 反隐单位登记（kind 码 32）。
message GameplayRegisterDetector {
  uint64 unit = 1;
  reserved 2 to 8;
}
// 夜间隐身候选（kind 码 33）。
message GameplaySetNightCloak {
  uint64 unit = 1;
  bool enabled = 2;
  reserved 3 to 8;
}
// 视线阻挡机制输入（kind 码 34）：只登记机制输入，不含 fog 可见性派生结果。
message GameplayMarkSightBlocker {
  uint64 blocker = 1;
  bool blocking = 2;
  reserved 3 to 8;
}
// 野怪睡眠（kind 码 35）：sleeps_at_night 为变体内布尔字段。
message GameplaySetCreepSleep {
  uint64 creep = 1;
  bool sleeps_at_night = 2;
  reserved 3 to 8;
}
// 回血条件（kind 码 36）：condition 为 RegenCondition::code() 的 uint32
// 稳定码（值域 0..=4），线格式层校验溢出与非法码后还原枚举。
message GameplaySetRegenCondition {
  uint64 unit = 1;
  uint32 condition = 2;
  reserved 3 to 8;
}

// 以下五个消息为 PROTOCOL_VERSION 9（P11 技能系统施法命令面）只追加：
// oneof tag 59–63 与 w3-core 的 kind 码 37–41 一一对应、顺序一致。
// EntityId 一律 uint64 的 value()、DefId 一律 uint32 定宽；点 / 范围 /
// 方向坐标、半径与方向向量均为 Q47.16 整数原始值，用 int64 定宽承载
// （解码侧 i64 无损还原、不收窄、不猜测、不回退）；语义合法性（caster /
// hero 非 EntityId::NONE、ability 合法、玩家归属）由 w3-core 同源校验
// 承担，线格式层只忠实传输。字段编号只追加、尾部保留 reserved，禁 map /
// 禁 float / 禁 double 全部继续适用。
// 点目标施法（kind 码 37，tag 59）：x / y 为点坐标整数原始值。
message GameplayCastPoint {
  uint64 caster = 1;
  uint32 ability = 2;
  int64 x = 3;
  int64 y = 4;
  reserved 5 to 8;
}
// 范围目标施法（kind 码 38，tag 60）：radius_raw 为半径整数原始值。
message GameplayCastArea {
  uint64 caster = 1;
  uint32 ability = 2;
  int64 x = 3;
  int64 y = 4;
  int64 radius_raw = 5;
  reserved 6 to 8;
}
// 方向目标施法（kind 码 39，tag 61）：dx / dy 为方向向量整数原始值。
message GameplayCastDirection {
  uint64 caster = 1;
  uint32 ability = 2;
  int64 dx = 3;
  int64 dy = 4;
  reserved 5 to 8;
}
// 学习 / 升级英雄技能（kind 码 40，tag 62）：hero 与技能 DefId。
message GameplayLearnAbility {
  uint64 hero = 1;
  uint32 ability = 2;
  reserved 3 to 8;
}
// 英雄升级并累积技能点（kind 码 41，tag 63）：仅携带英雄 EntityId。
message GameplayLevelUpHero {
  uint64 hero = 1;
  reserved 2 to 8;
}

// p18 / PROTOCOL_VERSION 10 唯一新增玩法命令变体（kind 码 42，tag 64）：
// 酒馆买活（R6.3），与祭坛 `ReviveHero` 的参数 / 命令分离。`hero` 为阵亡
// 英雄、`tavern` 为酒馆，均为 EntityId，一律用 uint64 的 value() 承载；
// 语义合法性（两者非 EntityId::NONE、英雄归属 / 阵亡登记）由 w3-core
// 同源校验承担，线格式层只忠实传输、不猜测、不回退。字段编号只追加、
// 尾部保留 reserved，禁 map / 禁 float / 禁 double 全部继续适用。
message GameplayBuybackHero {
  uint64 hero = 1;
  uint64 tavern = 2;
  reserved 3 to 8;
}

// 一批玩法命令；集合一律 repeated + 显式顺序，禁止 map。
message GameplayCommandBatch {
  repeated GameplayCommand commands = 1;
  reserved 2 to 8;
}
