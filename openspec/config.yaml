schema: spec-driven

context: |
  项目：rust_dazhang，GPLv3，Rust edition 2024 虚拟 workspace，复刻经典 RTS，
  第一版以 Melee 对战优先（ADR 0003）。crate：w3-core（零依赖确定性模拟内核）、
  w3-content（读取本机导出的 WC3 JSON，使用 serde/serde_json）。
  仓库绝不提交任何游戏资产。

  确定性是硬门禁（ADR 0002）：权威状态只使用 SimFixed Q47.16 整数数学；
  整数逻辑帧冻结为 30 Hz；命令按
  ExecuteFrame -> PlayerId -> Sequence -> Arrival 排序；稳定 EntityId 顺序；
  FNV-1a 状态哈希；快照 v1 是帧提交完成后的完整状态。
  w3-content 的坐标只是冻结的 f64 输入，绝不能进入快照或状态哈希；
  P2 必须先冻结 SimFixed 的转换规则。

  资产与法律边界（ADR 0001）：仓库不含暴雪资产，也不含 MPQ 派生的
  JSON/PNG/GLB/音效。玩家自备经典 1.27a 客户端；导出数据留在
  C:/open_rts/godot_warcraft3/assets，通过被 gitignore 的 config.toml 路径读取。
  只读参考项目共四个：vera20k (GPLv3)、godot_warcraft3 (MIT)、
  rts_kernel_cs (MIT)、WarsmashModEngine (AGPLv3，仅参考、不复制代码)，
  见 docs/references/UPSTREAM.md 与 NOTICE.md。

  验收命令：cargo test --workspace；cargo fmt --all -- --check。
  任何改动权威状态、帧序、命令排序、哈希编码或快照字段的变更，
  都必须保持 crates/w3-core/tests/determinism.rs 全绿。

  第一版范围之外：JASS/wtg 触发器 VM、自定义地图、战役、战争迷雾/隐身、
  Mod API、跨版本存档、Godot 宿主、官方战网。

  开发约定见 CODEBUDDY.md：源码注释（含 pub rustdoc）一律中文；
  git 提交信息描述一律中文（Conventional Commits 英文 type 前缀保留）；
  日志与错误信息一律英文；Rust 源码遵循官方 rustfmt 默认风格，
  写完 cargo fmt --all、提交前 cargo fmt --all -- --check；
  工具脚本一律用跨平台 Python / Node，不写 .ps1 / .sh / .bat / .cmd；
  所有文件 UTF-8 无 BOM、LF；
  AI 不得执行 git push / fetch / pull / clone 等远端同步命令。

  架构设计原则（本段即权威摘要，冲突以 CODEBUDDY.md 与 ADR 为准）：
  SRP / OCP / LSP / DIP / ISP / LoD / CARP 按 Rust 语境（模块 / trait / 组合 / 所有权）
  判定；正确性 / 确定性优先。硬红线：确定性契约（ADR 0002）、唯一状态所有者、
  w3-core 不反向依赖上层与冻结输入边界、显式失败不静默降级、只读参考不复制代码、
  rustfmt / 跨平台脚本 / 中文提交信息。

rules:
  proposal:
    - 引用相关 ADR 编号并标明路线图阶段（P0-P5）。
    - 声明对资产/法律边界与确定性的影响。
  specs:
    - 使用 SHALL/MUST；每条 requirement 至少一个 #### Scenario（WHEN/THEN）。
    - 新增权威状态必须声明进入状态哈希与快照 v1。
  design:
    - 每个决策都要关联 ADR 0002，并说明对跨平台确定性的影响。
    - 每个决策列出考虑过的备选方案。
    - 对照本文件 context 的架构设计原则，说明对确定性契约与分层依赖的影响。
  tasks:
    - 每条任务必须是复选框 `- [ ] X.Y ...`。
    - 涉及确定性代码的改动必须包含重跑 tests/determinism.rs 的任务。
