[package]
name = "w3-client"
version = "0.1.0"
edition = "2024"
publish = false
description = "Playable client integration layer: fixed 30 Hz stepping over the read-only simulation seam"

[lib]
name = "w3_client"
path = "src/lib.rs"

[dependencies]
# 内核、只读呈现层、内容层、冻结输入适配层与联机会话层；全部为向下依赖，无环。
# w3-app 仅依赖 w3-core / w3-content，w3-client → w3-app → w3-core 无环；
# 键鼠坐标经 w3_app::freeze_f64 走既有冻结边界（ADR 0004），不新增浮点→权威状态路径。
w3-core = { path = "../w3-core" }
w3-render = { path = "../w3-render" }
w3-content = { path = "../w3-content" }
w3-app = { path = "../w3-app" }
# 批次 C：联机 session 适配（只依赖、不侵入）；w3-net 不依赖上层 crate。
w3-net = { path = "../w3-net" }
# 真实窗口/呈现装配：与 w3-render 相同的 winit feature 集合（避免平台装饰依赖）。
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
wgpu = "30"
# 结构化日志门面：追帧超限 / 资源失败以英文 key=value 明确报告（CODEBUDDY.md §3）。
log = "0.4"
# 轻量 UI 依赖：egui 家族 0.37.0，取 MIT 一侧（与 GPLv3 兼容，ADR 0001 / design D4）。
# 批次 A 已核验与 wgpu 30.0.1 / winit 0.30.13 对齐；MSRV 1.95；NOTICE.md 登记交 docs-owner。
egui = "0.37"
egui-wgpu = "0.37"
# 关闭 egui-winit 默认 features：避免其 default（clipboard/wayland/x11/links）
# 经 feature 统一重新开启 winit 的默认 feature，保持与 w3-render 一致的
# 最小 winit feature 集（rwh_06），不引入平台装饰依赖。
egui-winit = { version = "0.37", default-features = false }
