[package]
name = "w3-content"
version = "0.1.0"
edition = "2024"
publish = false
description = "P1 reader for upstream WC3 JSON exports (no native MPQ/SLK parsing yet)"

[lib]
name = "w3_content"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 真实地表 tileset / 小地图 PNG 解码（BLP→PNG 由上游产出）；只启用 png，
# 保持最小依赖面。MIT OR Apache-2.0，与 GPLv3 兼容（见 NOTICE.md）。
image = { version = "0.25", default-features = false, features = ["png"] }
