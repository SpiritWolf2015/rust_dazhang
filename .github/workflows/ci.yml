# 统一门禁流水线：编码、格式、测试、OpenSpec 校验、资产扫描。
# Windows / Linux 双平台跑同一 python 入口，验证工具链跨平台。
# run 只写单行命令、不含 shell 语法；平台差异由 tools/verify_all.py 内部（os.name）处理。
# 若托管平台不使用 GitHub Actions，把 python tools/verify_all.py 配到其 CI 即可。
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Run project gates
        run: python tools/verify_all.py
