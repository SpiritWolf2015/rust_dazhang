[package]
name = "w3-client"
version = "0.1.0"
edition = "2024"
publish = false
description = "Playable client integration layer: fixed 30 Hz stepping over the read-only simulation seam"

[lib]
name = "w3_client"
path = "src/lib.rs"

[dependencies]
# 内核、只读呈现层、内容层、冻结输入适配层与联机会话层；全部为向下依赖，无环。
# w3-app 仅依赖 w3-core / w3-content，w3-client → w3-app → w3-core 无环；
# 键鼠坐标经 w3_app::freeze_f64 走既有冻结边界（ADR 0004），不新增浮点→权威状态路径。
w3-core = { path = "../w3-core" }
w3-render = { path = "../w3-render" }
w3-content = { path = "../w3-content" }
w3-app = { path = "../w3-app" }
# 批次 C：联机 session 适配（只依赖、不侵入）；w3-net 不依赖上层 crate。
w3-net = { path = "../w3-net" }
# 真实窗口/呈现装配：与 w3-render 相同的 winit feature 集合（避免平台装饰依赖）。
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
wgpu = "30"
# 结构化日志门面：追帧超限 / 资源失败以英文 key=value 明确报告（CODEBUDDY.md §3）。
log = "0.4"
# 轻量 UI 依赖：egui 家族 0.37.0，取 MIT 一侧（与 GPLv3 兼容，ADR 0001 / design D4）。
# 启用 default_fonts 使用内置开源字体（Ubuntu Font Licence 1.0，见 NOTICE.md），
# 不加载任何资产文件；内置字体无 CJK 字形，故 HUD 文案为 ASCII。
# 批次 A 已核验与 wgpu 30.0.1 / winit 0.30.13 对齐；MSRV 1.95。
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
# 关闭 egui-winit 默认 features：避免其 default（clipboard/wayland/x11/links）
# 经 feature 统一重新开启 winit 的默认 feature，保持与 w3-render 一致的
# 最小 winit feature 集（rwh_06），不引入平台装饰依赖。
egui-winit = { version = "0.37", default-features = false }

# Linux 平台后端：既有 [dependencies] 关闭 winit default 后，Linux 上不会命中
# 任何平台后端，将触发 winit platform_impl 末尾的 compile_error!。这里按
# target cfg 追加 x11，Cargo 对同 crate 同版本在 cfg 匹配时把 features 取并集：
# Linux 得到 rwh_06 + x11；Windows 不匹配该段，仍只有 rwh_06，win32 后端由
# winit 自身 target cfg 自动生效，故依赖图与行为零影响，无需改动既有依赖段。
# 选 x11 而非 wayland：x11 后端通过 x11-dl 在运行时动态加载系统库，编译期
# 依赖面最小；wayland 组会拉入 wayland-csd-adwaita / ab_glyph 等服务端装饰
# 依赖，正是当初关闭 default 与 egui-winit default 所规避的对象，因此不得
# 启用任何 wayland feature，egui-winit 的 default-features 也保持关闭。
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
