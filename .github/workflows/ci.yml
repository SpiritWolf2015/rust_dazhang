# 统一门禁流水线：编码、源码约定、格式、测试、OpenSpec 校验、资产扫描。
# Windows / Linux 双平台跑同一 python 入口，验证工具链跨平台。
# conventions job 为硬规则独立门禁（中文注释 / 英文日志 / UTF-8 无 BOM / 末尾换行 /
# 行尾空格 / 禁散落 println! / 工具脚本跨平台），不依赖 Rust 工具链、失败快且结果可见。
# run 只写单行命令、不含 shell 语法；平台差异由 tools/verify_all.py 内部（os.name）处理。
# 若托管平台不使用 GitHub Actions，把 python tools/verify_all.py 配到其 CI 即可。
name: CI

on:
  push:
  pull_request:

jobs:
  # 硬规则独立门禁：不依赖 Rust / protoc / OpenSpec，快速失败且结果单独可见。
  conventions:
    name: Source conventions (encoding / comments / logs / scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check encoding baseline
        run: python tools/check_encoding.py

      - name: Check source conventions
        run: python tools/check_source_conventions.py

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # w3-net 的 build.rs 用 prost-build 调用 protoc 生成消息类型；双平台须
      # 安装同版本 protoc，保证生成结果与字节编码一致（ADR 0005 / protobuf-payload）。
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Run project gates
        run: python tools/verify_all.py
